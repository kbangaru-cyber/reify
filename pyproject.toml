[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reify"
version = "0.1.0"
description = "Staged point cloud segmentation for building components"
requires-python = ">=3.10"
dependencies = [
    "plotly",
    "numpy",
    "pandas",
    "plyfile",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
